[package]
name = "squaremail-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ammonia = "4"
base64 = "0.22"
chrono = "0.4"
mail-parser = "0.11"
rand = "0.9"
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }
rusqlite = { version = "0.43", features = ["bundled"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
